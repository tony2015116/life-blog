{{- /* Recipe cover: an image named cover.* in the post folder, or a lettered placeholder. */ -}}
{{- with .Resources.GetMatch "cover.*" -}}
  {{- $img := partial "life/process-image.html" (dict "img" . "op" "fill" "spec" "640x420") -}}
  <img class="recipe-cover" src="{{ $img.RelPermalink }}" alt="" loading="lazy" width="640" height="420">
{{- else -}}
  <span class="recipe-cover recipe-cover-empty" aria-hidden="true">{{ substr .Title 0 1 }}</span>
{{- end -}}
